name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  self-scan:
    name: scan fixtures and upload SARIF
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      - name: Scan the intentionally vulnerable fixture
        shell: bash
        run: |
          set +e
          python -m mcpposture scan --path tests/fixtures/vulnerable_repo --format sarif -o mcpposture.sarif
          code=$?
          # Exit 1 means findings were reported, which is the point of this fixture; 0 or 2 is a regression.
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        # Private repositories without code scanning enabled reject the upload; that should not fail CI.
        continue-on-error: true
        with:
          sarif_file: mcpposture.sarif
          category: mcpposture-fixtures

      - name: Lint the example policy
        run: python -m mcpposture policy validate examples/policy.toml

      - name: Enforce the example policy (violations expected)
        shell: bash
        run: |
          set +e
          python -m mcpposture enforce --policy examples/policy.toml --path tests/fixtures/vulnerable_repo
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi

      - name: Fleet summary of 500 generated machines
        run: |
          python scripts/generate_fleet.py --machines 500 --out fleet-reports
          python -m mcpposture fleet fleet-reports --format json -o fleet-summary.json
          python -m mcpposture fleet fleet-reports

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            mcpposture.sarif
            fleet-summary.json
